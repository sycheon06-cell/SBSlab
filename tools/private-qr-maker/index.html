<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="QR 내용을 서버로 보내지 않고 브라우저 안에서 QR 코드를 생성하는 정적 웹 도구입니다.">
  <meta name="theme-color" content="#0f766e">
  <title>Private QR Maker</title>
  <style>
    :root {
      --bg: #eef3f6;
      --panel: #fff;
      --soft: #f7fafc;
      --ink: #111827;
      --muted: #617082;
      --line: #d8e0ea;
      --accent: #0f766e;
      --accent-dark: #0b5d57;
      --warn: #fff7e6;
      --warn-line: #f1cd88;
      --danger: #b42318;
      --shadow: 0 18px 46px rgba(15, 23, 42, .12);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: linear-gradient(180deg, #fbfdff 0%, var(--bg) 58%, #e4ebf1 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select, textarea { font: inherit; }

    .app {
      width: min(1160px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 16px;
      display: grid;
      align-content: center;
      gap: 16px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 420px);
      gap: 20px;
      align-items: stretch;
    }

    .panel {
      min-width: 0;
      border: 1px solid rgba(216, 224, 234, .95);
      border-radius: 8px;
      background: rgba(255, 255, 255, .96);
      box-shadow: var(--shadow);
    }

    .editor, .preview { padding: 24px; }
    .preview { display: grid; gap: 16px; align-content: center; }

    .header, .preview-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .brand { display: flex; gap: 13px; min-width: 0; }

    .mark {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
      padding: 7px;
      border: 1px solid #a9d8d1;
      border-radius: 8px;
      background: #e7f5f2;
    }

    .mark span { border-radius: 3px; background: var(--accent); }
    .mark span:nth-child(2) { opacity: .38; }
    .mark span:nth-child(3) { opacity: .58; }
    .mark span:nth-child(4) { background: #182033; }

    .eyebrow, .kicker {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1, h2 { margin: 0; letter-spacing: 0; word-break: keep-all; overflow-wrap: break-word; }
    h1 { max-width: 720px; font-size: clamp(2rem, 4.8vw, 3.6rem); line-height: 1.07; }
    h2 { font-size: 1.1rem; }

    .pill, .badge {
      min-width: 92px;
      padding: 8px 12px;
      border: 1px solid #b7ddd7;
      border-radius: 999px;
      color: var(--accent-dark);
      background: #e7f5f2;
      font-size: .82rem;
      font-weight: 800;
      text-align: center;
      white-space: nowrap;
    }

    .pill.error { color: var(--danger); border-color: #f4b7af; background: #fff0ee; }

    .note {
      margin: 20px 0 18px;
      padding: 14px 16px;
      border: 1px solid var(--warn-line);
      border-radius: 8px;
      color: #493a18;
      background: var(--warn);
      line-height: 1.55;
      word-break: keep-all;
    }

    .note strong { display: block; color: #2f250d; }
    .label, .control span { display: block; margin-bottom: 8px; color: #344054; font-size: .88rem; font-weight: 750; }

    textarea {
      width: 100%;
      min-height: 172px;
      resize: vertical;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--soft);
      line-height: 1.55;
      outline: none;
    }

    textarea:focus, select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15, 118, 110, .18); }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
    .control { min-width: 0; padding: 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }

    select {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      outline: none;
    }

    input[type="range"] { width: 100%; accent-color: var(--accent); }
    output { display: block; margin-top: 6px; color: var(--muted); font-size: .82rem; }
    .colors { display: flex; gap: 10px; }
    input[type="color"] { width: 52px; height: 42px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--accent);
      border-radius: 7px;
      color: #fff;
      background: var(--accent);
      font-weight: 800;
      cursor: pointer;
    }

    button:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    button:disabled { opacity: .52; cursor: not-allowed; }
    .ghost { color: var(--ink); border-color: var(--line); background: #fff; }
    .ghost:hover { color: var(--ink); border-color: #b9c5d4; background: #f7f9fc; }

    .frame {
      width: 100%;
      max-width: 392px;
      min-width: 0;
      margin: 0 auto;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      padding: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(45deg, #edf2f7 25%, transparent 25%),
        linear-gradient(-45deg, #edf2f7 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #edf2f7 75%),
        linear-gradient(-45deg, transparent 75%, #edf2f7 75%);
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-size: 20px 20px;
    }

    canvas { display: block; width: 100%; max-width: 360px; min-width: 0; height: auto; image-rendering: pixelated; box-shadow: 0 12px 28px rgba(23, 32, 51, .15); }

    .meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0; }
    .meta div { min-width: 0; padding: 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .meta dt { color: var(--muted); font-size: .72rem; font-weight: 750; text-transform: uppercase; }
    .meta dd { margin: 4px 0 0; font-size: 1rem; font-weight: 850; overflow-wrap: anywhere; }

    .footer { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); font-size: .83rem; }

    @media (max-width: 900px) {
      .app { max-width: 640px; align-content: start; padding: 14px 10px; }
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .editor, .preview { padding: 18px; }
      .header, .preview-head { flex-direction: column; }
      .grid { grid-template-columns: minmax(0, 1fr); }
      textarea { min-height: 148px; }
      h1 { font-size: clamp(1.75rem, 7vw, 2.55rem); line-height: 1.14; }
      .footer { flex-direction: column; }
    }

    @media (max-width: 430px) {
      .app { padding-left: 8px; padding-right: 8px; }
      .editor, .preview { padding: 16px; }
      .brand { flex-direction: column; }
      .actions button { flex: 1 1 120px; min-height: 48px; }
      .meta { grid-template-columns: minmax(0, 1fr); }
      select { min-height: 48px; }
      .frame { padding: 10px; max-width: 100%; }
      canvas { width: calc(100vw - 86px); max-width: 280px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="workspace" aria-label="QR code maker">
      <div class="panel editor">
        <header class="header">
          <div class="brand">
            <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <div>
              <p class="eyebrow">Private QR Maker</p>
              <h1>브라우저에서만 생성하는 QR 코드</h1>
            </div>
          </div>
          <div class="pill" id="status">Ready</div>
        </header>

        <div class="note">
          <strong>입력한 QR 내용은 서버로 전송되지 않습니다.</strong>
          이 페이지의 JavaScript가 현재 브라우저 안에서 QR 이미지를 생성합니다. QR 렌더링 라이브러리만 CDN에서 불러옵니다.
        </div>

        <label class="label" for="qrText">QR에 담을 내용</label>
        <textarea id="qrText" spellcheck="false" placeholder="URL, 문구, 연락처 정보 등을 입력하세요.">https://sycheon06-cell.github.io/SBSlab/tools/private-qr-maker/</textarea>

        <div class="grid">
          <label class="control"><span>오류 복원</span><select id="level"><option value="M" selected>Medium</option><option value="L">Low</option><option value="Q">Quartile</option><option value="H">High</option></select></label>
          <label class="control"><span>크기</span><input id="size" type="range" min="160" max="720" step="20" value="360"><output id="sizeValue">360 px</output></label>
          <label class="control"><span>여백</span><input id="margin" type="range" min="1" max="8" step="1" value="4"><output id="marginValue">4 modules</output></label>
          <label class="control"><span>색상</span><div class="colors"><input id="dark" type="color" value="#111827" aria-label="QR foreground color"><input id="light" type="color" value="#ffffff" aria-label="QR background color"></div></label>
        </div>

        <div class="actions"><button id="png" type="button">PNG</button><button id="svg" type="button">SVG</button><button id="clear" type="button" class="ghost">Clear</button></div>
      </div>

      <aside class="panel preview" aria-label="Generated QR preview">
        <div class="preview-head"><div><p class="kicker">Live preview</p><h2>출력 미리보기</h2></div><span class="badge">Local only</span></div>
        <div class="frame"><canvas id="canvas" width="360" height="360"></canvas></div>
        <dl class="meta"><div><dt>Version</dt><dd id="version">-</dd></div><div><dt>Size</dt><dd id="pixels">-</dd></div><div><dt>Bytes</dt><dd id="bytes">-</dd></div></dl>
      </aside>
    </section>
    <footer class="footer"><span>Static web app for GitHub Pages.</span><span>No backend, no upload, no tracking script.</span></footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script>
    const byId = (id) => document.getElementById(id);
    const text = byId('qrText');
    const level = byId('level');
    const size = byId('size');
    const margin = byId('margin');
    const dark = byId('dark');
    const light = byId('light');
    const canvas = byId('canvas');
    const status = byId('status');
    const png = byId('png');
    const svg = byId('svg');
    let lastSvg = '';

    function setStatus(message, isError) {
      status.textContent = message;
      status.classList.toggle('error', Boolean(isError));
    }

    function setDownloads(enabled) {
      png.disabled = !enabled;
      svg.disabled = !enabled;
    }

    function downloadFile(name, blob) {
      const anchor = document.createElement('a');
      anchor.href = URL.createObjectURL(blob);
      anchor.download = name;
      document.body.append(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(anchor.href);
    }

    function render() {
      const value = text.value.trim();
      byId('sizeValue').value = `${size.value} px`;
      byId('marginValue').value = `${margin.value} modules`;

      if (!window.QRCode || typeof QRCode.toCanvas !== 'function') {
        setStatus('라이브러리 로드 실패', true);
        setDownloads(false);
        return;
      }

      if (!value) {
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        setStatus('내용 입력 필요', true);
        setDownloads(false);
        byId('version').textContent = '-';
        byId('pixels').textContent = '-';
        byId('bytes').textContent = '-';
        return;
      }

      const options = {
        errorCorrectionLevel: level.value,
        margin: Number(margin.value),
        width: Number(size.value),
        color: { dark: dark.value, light: light.value }
      };

      QRCode.toCanvas(canvas, value, options, (error) => {
        if (error) {
          setStatus('생성 실패', true);
          setDownloads(false);
          return;
        }
        QRCode.toString(value, { ...options, type: 'svg' }, (svgError, output) => { lastSvg = svgError ? '' : output; });
        setStatus('생성 완료', false);
        setDownloads(true);
        byId('version').textContent = 'auto';
        byId('pixels').textContent = `${canvas.width} px`;
        byId('bytes').textContent = new TextEncoder().encode(value).length;
      });
    }

    [text, level, size, margin, dark, light].forEach((element) => {
      element.addEventListener('input', render);
      element.addEventListener('change', render);
    });

    png.addEventListener('click', () => canvas.toBlob((blob) => blob && downloadFile('qr-code.png', blob), 'image/png'));
    svg.addEventListener('click', () => lastSvg && downloadFile('qr-code.svg', new Blob([lastSvg], { type: 'image/svg+xml' })));
    byId('clear').addEventListener('click', () => { text.value = ''; text.focus(); render(); });
    render();
  </script>
</body>
</html>
